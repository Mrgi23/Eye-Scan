name: Setup Wayland
description: Setup Wayland environment

runs:
  using: "composite"

  steps:
    - shell: bash
      run: |
        set -euo pipefail

        apt-get install -y weston qt6-wayland

        export XDG_RUNTIME_DIR=/tmp/xdg-runtime
        mkdir -p "${XDG_RUNTIME_DIR}"
        chmod 700 "${XDG_RUNTIME_DIR}"

        weston --backend=headless-backend.so --use-gl --socket=wayland-0 --idle-time=0 \
        > /tmp/weston.log 2>&1 &
        sleep 2

        {
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime"
          echo "WAYLAND_DISPLAY=wayland-0"
        } >> $GITHUB_ENV
