name: Setup C++ toolchain
description: Install and configure the C++ toolchain and Conan package manager

runs:
  using: "composite"

  steps:
    - shell: bash
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y build-essential cmake curl gcc g++ git gpg lcov \
          libavif-dev libcamera-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
          libjpeg-dev libopenblas-dev libopenjp2-7-dev libopenexr-dev \
          libpng-dev libwebp-dev ninja-build pipx pkg-config \
          qt6-base-dev qt6-tools-dev

        pipx ensurepath && pipx install conan
        export PATH="$HOME/.local/bin:$PATH"

        conan profile detect --force
        conan remote add conancenter https://center2.conan.io --force
        conan remote add artifactory https://conan.mrgi23.com/artifactory/api/conan/Conan-Index --force
